<!-- D-Bus policy for the NEOX shell session service. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow own="org.neox.Shell"/>
    <allow send_destination="org.neox.Shell"/>
    <allow receive_sender="org.neox.Shell"/>
  </policy>
</busconfig>
