# NEOX Hyprland configuration
# This file is installed as ~/.config/hypr/hyprland.conf by scripts/install.sh.
# It creates a mobile-inspired Wayland desktop on top of Hyprland.

# -----------------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------------
# Identify the session for portals, toolkits and .desktop OnlyShowIn matching.
env = XDG_CURRENT_DESKTOP,NEOX:Hyprland
env = XDG_SESSION_DESKTOP,neox
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = NEOX_CONFIG_HOME,$HOME/.config/neox
env = NEOX_HD_MODE,1
env = NEOX_SCALE,auto
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# -----------------------------------------------------------------------------
# Monitor configuration
# -----------------------------------------------------------------------------
# Automatically configure all monitors at preferred resolution and refresh rate.
# Users can override this line from ~/.config/neox/neox.conf or Hyprland includes.
monitor = ,preferred,auto,auto

# Example HiDPI override kept commented for discoverability.
# monitor = eDP-1,preferred,0x0,1.5
# monitor = HDMI-A-1,preferred,auto,1

# -----------------------------------------------------------------------------
# Input
# -----------------------------------------------------------------------------
input {
    # Turkish + US layouts; switch with Alt+Shift.
    kb_layout = tr,us
    kb_variant = ,
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    # Mouse pointer speed: 0 is libinput default.
    sensitivity = 0
    accel_profile = adaptive

    touchpad {
        # Mobile-like natural scrolling and tap-to-click.
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        disable_while_typing = true
        scroll_factor = 1.0
    }
}

gestures {
    # Three-finger horizontal gestures switch workspaces with an iOS-like feel.
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 280
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 25
    workspace_swipe_cancel_ratio = 0.25
    workspace_swipe_create_new = true
}

# -----------------------------------------------------------------------------
# General appearance
# -----------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(60a5faff) rgba(a78bfaff) 45deg
    col.inactive_border = rgba(343a46cc)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# -----------------------------------------------------------------------------
# Decorations
# -----------------------------------------------------------------------------
decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 22
        render_power = 4
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }

    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.0117
        contrast = 0.95
        brightness = 0.9
        vibrancy = 0.18
    }

    dim_inactive = true
    dim_strength = 0.10
}

# -----------------------------------------------------------------------------
# Animations
# -----------------------------------------------------------------------------
animations {
    enabled = true

    # Smooth cubic-bezier curves modeled after mobile OS motion design.
    bezier = neoxEase, 0.4, 0.0, 0.2, 1.0
    bezier = neoxOut, 0.16, 1.0, 0.3, 1.0
    bezier = neoxSpring, 0.34, 1.56, 0.64, 1.0

    animation = windowsIn, 1, 4, neoxSpring, slide
    animation = windowsOut, 1, 3, neoxEase, popin 85%
    animation = windowsMove, 1, 4, neoxOut
    animation = border, 1, 4, neoxEase
    animation = fade, 1, 3, neoxEase
    animation = fadeIn, 1, 3, neoxEase
    animation = fadeOut, 1, 2, neoxEase
    animation = workspaces, 1, 5, neoxOut, slide
    animation = specialWorkspace, 1, 4, neoxSpring, slidevert
    animation = layers, 1, 4, neoxSpring, slide
}

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
    smart_split = true
    smart_resizing = true
}

master {
    new_status = master
    mfact = 0.55
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
    vrr = 1
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
    new_window_takes_over_fullscreen = 2
}

# -----------------------------------------------------------------------------
# Layer rules for NEOX shell surfaces
# -----------------------------------------------------------------------------
# GTK layer-shell namespaces are set from Python for each component.
layerrule = blur, neox-panel
layerrule = ignorezero, neox-panel
layerrule = animation slide top, neox-panel
layerrule = blur, neox-search
layerrule = ignorezero, neox-search
layerrule = animation slide top, neox-search
layerrule = blur, neox-task-switcher
layerrule = ignorezero, neox-task-switcher
layerrule = animation fade, neox-task-switcher
layerrule = blur, neox-hd-dashboard
layerrule = ignorezero, neox-hd-dashboard
layerrule = animation fade, neox-hd-dashboard
layerrule = blur, neox-notification-center
layerrule = animation slide right, neox-notification-center
layerrule = blur, neox-control-center
layerrule = animation slide top, neox-control-center
layerrule = blur, neox-logout-screen
layerrule = animation fade, neox-logout-screen
layerrule = noanim, neox-desktop-grid
layerrule = blur, neox-osd
layerrule = animation slide, neox-osd

# -----------------------------------------------------------------------------
# Window rules for regular NEOX windows and helper dialogs
# -----------------------------------------------------------------------------
windowrulev2 = float, class:^(org.neox.ControlCenter)$
windowrulev2 = size 980 700, class:^(org.neox.ControlCenter)$
windowrulev2 = center, class:^(org.neox.ControlCenter)$
windowrulev2 = float, class:^(org.neox.ProgramCenter)$
windowrulev2 = size 1180 760, class:^(org.neox.ProgramCenter)$
windowrulev2 = center, class:^(org.neox.ProgramCenter)$
windowrulev2 = float, class:^(org.neox.ThemeEngine)$
windowrulev2 = size 720 540, class:^(org.neox.ThemeEngine)$
windowrulev2 = center, class:^(org.neox.ThemeEngine)$
windowrulev2 = float, class:^(org.neox.WallpaperManager)$
windowrulev2 = size 900 620, class:^(org.neox.WallpaperManager)$
windowrulev2 = center, class:^(org.neox.WallpaperManager)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = opacity 0.94 0.88, class:^(foot|Alacritty|kitty)$
windowrulev2 = noborder, fullscreen:1

# -----------------------------------------------------------------------------
# Workspaces
# -----------------------------------------------------------------------------
workspace = 1, name:Ana
workspace = 2, name:Web
workspace = 3, name:Kod
workspace = 4, name:Medya
workspace = 5, name:Ofis
workspace = 6, name:Sohbet
workspace = 7, name:Dosya
workspace = 8, name:Sistem
workspace = 9, name:Oyun

# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------
$mainMod = SUPER
$terminal = foot
$fileManager = nautilus
$browser = xdg-open https://www.google.com

# Bare Super launches/toggles the mobile task switcher when released.
bindr = $mainMod, Super_L, exec, neox-task-switcher
bindr = $mainMod, Super_R, exec, neox-task-switcher

# Core shell interactions.
bind = $mainMod, SPACE, exec, neox-app-search
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, neox-logout-screen
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, L, exec, neox-lock-screen
bind = $mainMod, C, exec, neox-control-center
bind = $mainMod, H, exec, neox-hd-dashboard
bind = $mainMod, A, exec, neox-program-center
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, W, exec, neox-wallpaper-manager
bind = $mainMod, D, exec, neox-desktop-grid --toggle

# Window management.
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# Workspaces 1-9.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse interactions.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots and recording.
bind = , Print, exec, mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png" && notify-send 'NEOX' 'Ekran görüntüsü kaydedildi'
bind = $mainMod, Print, exec, mkdir -p "$HOME/Pictures/Screenshots" && grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S-area').png" && notify-send 'NEOX' 'Alan ekran görüntüsü kaydedildi'
bind = $mainMod SHIFT, Print, exec, hyprshot -m window -o "$HOME/Pictures/Screenshots" || notify-send 'NEOX' 'hyprshot bulunamadı'
bind = $mainMod ALT, R, exec, pkill -INT wf-recorder || wf-recorder -f "$HOME/Videos/neox-recording-$(date +'%Y-%m-%d_%H-%M-%S').mp4"

# Audio and brightness.  The OSD helper performs the change and displays feedback.
bindel = , XF86AudioRaiseVolume, exec, neox-volume-brightness volume up
bindel = , XF86AudioLowerVolume, exec, neox-volume-brightness volume down
bindl = , XF86AudioMute, exec, neox-volume-brightness volume mute
bindel = , XF86MonBrightnessUp, exec, neox-volume-brightness brightness up
bindel = , XF86MonBrightnessDown, exec, neox-volume-brightness brightness down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# -----------------------------------------------------------------------------
# Autostart
# -----------------------------------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE NEOX_CONFIG_HOME
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE NEOX_CONFIG_HOME
exec-once = /usr/lib/xdg-desktop-portal-hyprland 2>/dev/null || true
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 2>/dev/null || /usr/lib/polkit-kde-authentication-agent-1 2>/dev/null || true
exec-once = gnome-keyring-daemon --start --components=secrets,ssh,pkcs11
exec-once = pipewire
exec-once = wireplumber
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store
exec-once = hyprpaper || swaybg -m fill -i "$HOME/.config/neox/wallpapers/default.svg"
exec-once = swayidle -w timeout 300 'neox-lock-screen' timeout 600 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'neox-lock-screen'
exec-once = neox-shell
exec-once = neox-panel
exec-once = neox-desktop-grid
exec-once = neox-notification-center --daemon
exec-once = neox-volume-brightness --daemon
exec-once = neox-wallpaper-manager --daemon

# Include user overrides last so local changes win.
source = ~/.config/neox/keybindings.conf
