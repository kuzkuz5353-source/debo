# NEOX main configuration
# INI format consumed by shell/neox_common.py ConfigManager.

[shell]
manage_components = false
log_level = INFO
language = tr_TR

[appearance]
theme = neox-hd
accent = #60a5fa
corner_radius = 16
font_family = Inter, SF Pro Display, Cantarell, sans-serif
font_size = 15
hd_mode = true
interface_scale = auto
auto_theme = false
wallpaper_accent = true

[panel]
width = 460
height = 46
expanded_width_percent = 74
notification_preview_seconds = 3
media_auto_expand = true
hd_shadows = true

[desktop_grid]
columns = 8
rows = 5
icon_size = 96
category_mode = false
show_favorites_first = true
folder_popup_columns = 4

[task_switcher]
focus_mode = focus
max_per_page = 10
capture_thumbnails = true
thumbnail_cache_seconds = 20

[notifications]
dnd = false
history_limit = 200
group_by_app = true
critical_flash = true

[control_center]
quick_panel_width = 520
night_light_temperature = 4200
advanced_pages = true

[hd_dashboard]
enabled = true
favorite_limit = 15
metric_refresh_seconds = 3
workspace_refresh_seconds = 4

[lock_screen]
auto_lock_seconds = 300
dpms_seconds = 600
blur_radius = 16

[wallpaper]
slideshow = false
slideshow_interval = 900
live_wallpaper = false

[widgets]
weather_location = Istanbul
clock_24h = true

[accessibility]
large_text = false
high_contrast = false
color_filter = none
magnifier = false
