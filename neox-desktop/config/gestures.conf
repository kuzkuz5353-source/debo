# NEOX gesture configuration.
# Hyprland-native workspace gestures are defined in compositor/hyprland.conf.
# This file is reserved for future libinput-gestures/touchegg integrations.

[gestures]
three_finger_swipe_left = workspace_next
three_finger_swipe_right = workspace_previous
four_finger_swipe_up = task_switcher
four_finger_swipe_down = control_center
edge_swipe_right = notification_center
edge_swipe_top = quick_settings
