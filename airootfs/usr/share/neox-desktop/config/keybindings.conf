# User-editable NEOX Hyprland keybinding overrides.
# This file is sourced at the end of compositor/hyprland.conf.
# Add custom binds here, or comment out conflicting lines in hyprland.conf.

# HD interface shortcuts.
bind = SUPER, H, exec, neox-hd-dashboard
bind = SUPER, A, exec, neox-program-center

# Example: open quick settings with Super+S.
bind = SUPER, S, exec, neox-control-center --quick

# Example: open widget shortcuts.
bind = SUPER, K, exec, neox-calendar-widget
bind = SUPER, B, exec, neox-weather-widget
bind = SUPER, X, exec, neox-system-monitor-widget
